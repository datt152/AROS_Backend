name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build
        # Skip tests: @SpringBootTest cần PostgreSQL (chưa có trong CI)
        run: ./mvnw -B package -DskipTests
        env:
          JWT_SECRET: Q0ktVGVzdC1KV1QtU2VjcmV0LUtleS1BdC1MZWFzdC0zMi1CeXRlcw==
