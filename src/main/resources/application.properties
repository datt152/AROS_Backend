# =============================================================================
# AROS Backend - Application Configuration
# Giá trị nhạy cảm đọc từ biến môi trường (xem file .env khi chạy local).
# Trên Render: khai báo các biến tương ứng trong Dashboard > Environment.
# =============================================================================

# --- Application ---
spring.application.name=AROSBackend

# --- Server (Render tự inject PORT) ---
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aros_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:omr_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:omr_password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Auth cookie (refresh token) ---
auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:true}
auth.refresh-cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

# --- CORS (Frontend) ---
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:*}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Skip-Auth-Refresh
app.cors.allow-credentials=true

# --- OMR Engine ---
omr.engine.base-url=${OMR_ENGINE_BASE_URL:http://localhost:8000}
omr.engine.connect-timeout-ms=5000
omr.engine.read-timeout-ms=60000
omr.engine.max-retries=1

# --- OMR file upload ---
omr.upload.dir=${OMR_UPLOAD_DIR:uploads/omr}
omr.upload.max-size-mb=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Mail (SMTP) ---
# Gmail: host=smtp.gmail.com, port=587, password = App Password (không dùng mật khẩu đăng nhập)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Địa chỉ hiển thị người gửi + link FE trong nội dung mail
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
app.mail.from-name=${APP_MAIL_FROM_NAME:AROS}
app.mail.frontend-url=${APP_MAIL_FRONTEND_URL:http://localhost:5173}

# --- Cloudflare Turnstile (register only; secret never exposed to FE) ---
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
turnstile.siteverify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
turnstile.connect-timeout-ms=5000
turnstile.read-timeout-ms=10000

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.mail=INFO

# --- Actuator (health check) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
