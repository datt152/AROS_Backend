spring.application.name=AROSBackend
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/aros_db
spring.datasource.username=omr_admin
spring.datasource.password=omr_password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080

# JWT: access token ngắn hạn (30 phút), refresh token dài hạn (7 ngày)
jwt.access-expiration-ms=1800000
jwt.refresh-expiration-ms=604800000

# Refresh cookie: HttpOnly, Secure, SameSite, chỉ gửi tới /api/v1/auth/refresh
# Local HTTP: đặt auth.refresh-cookie.secure=false vì Secure cookie yêu cầu HTTPS
auth.refresh-cookie.secure=true
auth.refresh-cookie.same-site=Lax