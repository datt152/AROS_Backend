# =============================================================================
# AROS Backend - Application Configuration
# Chỉnh sửa file này trước khi deploy. Tất cả cấu hình runtime nằm ở đây.
# =============================================================================

# --- Application ---
spring.application.name=AROSBackend

# --- Server ---
server.port=8080

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/aros_db
spring.datasource.username=omr_admin
spring.datasource.password=omr_password123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto: update (dev) | validate (prod khuyến nghị khi đã có migration)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
# Secret phải là chuỗi Base64, tối thiểu 256 bit. ĐỔI giá trị này trước khi deploy production.
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Access token: 30 phút | Refresh token: 7 ngày
jwt.access-expiration-ms=1800000
jwt.refresh-expiration-ms=604800000

# --- Auth cookie (refresh token) ---
# Local HTTP: đặt secure=false vì Secure cookie yêu cầu HTTPS
# Production HTTPS: secure=true
auth.refresh-cookie.secure=true
auth.refresh-cookie.same-site=Lax

# --- CORS (Frontend) ---
# Production: thay * bằng domain FE, ví dụ https://app.example.com
app.cors.allowed-origin-patterns=*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept
app.cors.allow-credentials=true

# --- OMR Engine ---
omr.engine.base-url=http://localhost:8000
omr.engine.connect-timeout-ms=5000
omr.engine.read-timeout-ms=60000
omr.engine.max-retries=1

# --- OMR file upload ---
omr.upload.dir=uploads/omr
omr.upload.max-size-mb=10
# Spring multipart limit (phải >= omr.upload.max-size-mb)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# --- Actuator (health check) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
