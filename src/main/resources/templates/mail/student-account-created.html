<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Tài khoản AROS</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #222;">
<p>Xin chào <strong th:text="${fullName}">Sinh viên</strong>,</p>

<p>
    Tài khoản sinh viên trên <span th:text="${appName}">AROS</span> đã được tạo.
</p>

<table style="border-collapse: collapse; margin: 16px 0;">
    <tr>
        <td style="padding: 4px 12px 4px 0;"><strong>Email đăng nhập:</strong></td>
        <td th:text="${email}">email@example.com</td>
    </tr>
    <tr>
        <td style="padding: 4px 12px 4px 0;"><strong>Mật khẩu tạm:</strong></td>
        <td th:text="${temporaryPassword}">********</td>
    </tr>
</table>

<p>
    Vui lòng đăng nhập và đổi mật khẩu sau lần đầu sử dụng:<br/>
    <a th:href="${loginUrl}" th:text="${loginUrl}">http://localhost:5173</a>
</p>

<p style="color: #666; font-size: 13px;">
    Nếu bạn không phải người nhận dự kiến, hãy bỏ qua email này.
</p>
</body>
</html>
